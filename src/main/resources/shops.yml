# Official Vephilim NPC catalog baseline before v1.0.0.
# BUY = player buys from NPC. SELL = player sells to NPC.
# The shops are whitelist-based: items not listed here cannot be traded by that NPC.
# Therefore the requested blacklist items are intentionally absent from listings.
#
# Blacklist food: GOLDEN_APPLE, ENCHANTED_GOLDEN_APPLE, GOLDEN_CARROT, SUSPICIOUS_STEW.
# Blacklist ore: NETHER_QUARTZ, NETHER_GOLD_ORE, ANCIENT_DEBRIS, NETHERITE_SCRAP,
# NETHERITE_INGOT, and all Nether ore/resources not explicitly listed.
# Blacklist farmer: MELON, MELON_SLICE, NETHER_WART, CHORUS_FRUIT, CHORUS_FLOWER,
# and Nether farm products not explicitly listed.
# Blacklist fisherman: NAUTILUS_SHELL, HEART_OF_THE_SEA, enchanted fishing rods,
# and fishing-treasure items not explicitly listed.
#
# Fresh-install stock defaults:
# - food is BUY-only and starts with 512 stock/item so the NPC is immediately usable;
# - SELL-only shops start at 0 and accept stock up to 4096/item.
# Existing servers keep their current stock.yml; initial-stock only seeds brand-new listings.
#
# Schema notes:
# - npc-id: -1 means not yet bound to a Citizens NPC.
# - enabled: false prevents accidental activation before NPC binding/review.
# - manager is metadata only and does not grant permission.
# - runtime stock is stored separately in stock.yml.
# - item identity is currently plain vanilla/material based.
